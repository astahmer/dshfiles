# Replaces the stock JSONL session-persistence row with this fork: a request
# header's assembled tool catalog is stored once per Session, and every later
# request that repeats the same catalog stores a reference the reader expands
# again. The native row is disabled, never patched in place — DSH core stays
# untouched.
#
# A patch replaces a row's whole `config`, so the inserted row restates the
# value the base composition ships (`session-persistence-jsonl.root`). Keep the
# two in sync.
- id: session-persistence-jsonl
  disabled: true
- insert:
    - id: dshfiles-session-persistence-jsonl
      name: '@dshfiles/session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
