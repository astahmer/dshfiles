name: Plugin E2E coverage

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full journey run; PRs only get the @smoke subset from the Required checks e2e-smoke job.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-audit:
    name: Inventory, feature map, and BDD discovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Test dynamic plugin inventory
        run: pnpm run test:inventory
        working-directory: tooling/dshx

      - name: Build dshx and create-dshx for the catalog test and Gherkin discovery
        run: |
          pnpm --dir tooling/dshx/packages/create-dshx run build
          pnpm --dir tooling/dshx/packages/dshx run build

      - name: Test feature catalog invariants
        run: pnpm run test:feature-coverage
        working-directory: tooling/dshx

      - name: Generate the coverage report
        continue-on-error: true
        run: pnpm run features:report > "$RUNNER_TEMP/plugin-feature-coverage.md" 2>&1
        working-directory: tooling/dshx

      - name: Build the owned bundles the step files import
        # Gherkin steps import plugin source, and that source imports sibling packages through their built dist
        # (@dshfiles/sqlite-store, @dshfiles/jev, @dshfiles/jj-cli …). Without this build the discovery fails with
        # ERR_MODULE_NOT_FOUND on a cold checkout.
        run: pnpm exec turbo run build --filter='./plugins/@dshfiles/*' --output-logs=errors-only

      - name: Generate and list Gherkin browser tests
        run: |
          pnpm run test:e2e:gen
          pnpm exec playwright test --config=playwright.e2e.config.ts --list > "$RUNNER_TEMP/plugin-browser-tests.txt"
        working-directory: tooling/dshx

      - name: Enforce complete feature mapping
        run: pnpm run features:check
        working-directory: tooling/dshx

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-e2e-coverage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-feature-coverage.md
            ${{ runner.temp }}/plugin-browser-tests.txt
          if-no-files-found: warn
          retention-days: 14

  journeys:
    # Every journey, not the @smoke subset: a whole suite measured 30-50 minutes serial, too slow to gate each PR, so it
    # runs nightly and on demand. Shards own whole plugins round-robin (`scripts/ci/plugin-shard.mjs journeys`), like the
    # smoke shards, so a journey never depends on another shard.
    name: journeys (${{ matrix.shard }}/6)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TURBO_CONCURRENCY: '2'
      # A baseline must run every scenario: neither a restored Turbo task nor a per-scenario receipt may replay a pass.
      TURBO_FORCE: '1'
      DSHX_E2E_SCENARIO_CACHE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
          ffmpeg: 'true'
          browsers: 'true'
          systemd-scope: 'true'
      - run: node scripts/ci/plugin-shard.mjs ${{ matrix.shard }} 6 journeys
      - name: Upload journey evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-journeys-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            tooling/dshx/test-results
            tooling/dshx/playwright-report
            .dsh-e2e-evidence
          if-no-files-found: warn
          retention-days: 7
