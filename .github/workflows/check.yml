name: Required checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.45.1/jj-v0.45.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP" ./jj
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Start a systemd user manager for subprocess scopes
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for attempt in $(seq 1 50); do [ -S "$runtime/bus" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemd-run --user --scope --quiet true
      - run: pnpm install:all
      - name: Install Playwright Chromium
        run: pnpm --dir tooling/dshx exec playwright install --with-deps --only-shell chromium
      - run: pnpm check
