# Merge gate. One logical gate, seven parallel jobs.
#
# Branch protection matches the single `gate` job below (displayed as "Required checks / gate"). It `needs:` every
# job and asserts they all passed, so the required check name stays stable when a job is added, renamed or sharded —
# never make an individual job the required check.
#
# Why it is split: the old single `pnpm check` job took 2006s, and its long poles ran strictly one after another —
# plugins build 260s, plugins typecheck 113s, plugins tests 655s, boot 521s, e2e smoke 256s. Each job below runs one
# pole on its own 4 vCPU / 16 GB runner, so the gate costs the slowest pole instead of their sum.
#
# Job → local command (`pnpm check` is unchanged and still runs all of them in one process):
#   lint      pnpm run lint + pnpm run fmt:check
#   types     pnpm run typecheck:scripts, dshx typecheck (the packages' typecheck runs in the units shards)
#   units     3 shards of the plugins build+typecheck+test (`scripts/ci/plugin-shard.mjs`, same Turbo tasks)
#   dshx      pnpm run check:dshx
#   repo      check:cycles, check:native-forks, test:scripts, verify:web-profile-contract, check:repo,
#             check:effect-native, knip, check:screenshots
#   boot      3 shards of pnpm run check:plugin-boot (`scripts/ci/plugin-shard.mjs boot`)
#   e2e-smoke pnpm run check:e2e:smoke
name: Required checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo's default is ten concurrent tasks per job. Two keeps a plugin suite (real jj, git, node and Chromium
  # children) inside 16 GB and is safe now that each job has its own runner: the old job ran every suite on one
  # machine and OOM-killed the vitest fork that mounts a real Host. fff-search still limits itself to a single fork.
  TURBO_CONCURRENCY: '2'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run the lint gates
        run: |
          pnpm run lint
          pnpm run fmt:check

  types:
    name: types
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The workspace contract is a manifest rule, so it rides with the compiler pass that reads the same manifests.
      - run: pnpm run typecheck:scripts
      - run: pnpm --dir plugins run contract
      # The owned bundles' `typecheck` task dependsOn `build`, so it runs beside their build and tests in the units
      # shards instead of paying a second full plugin build here.
      - run: pnpm --dir tooling/dshx run typecheck

  units:
    name: units (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
          ffmpeg: 'true'
      - run: node scripts/ci/plugin-shard.mjs ${{ matrix.shard }} 3

  dshx:
    name: dshx
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
          browsers: 'true'
      - run: pnpm run check:dshx

  repo:
    name: repo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
      # `check:repo` and `check:screenshots` run the dshx CLI and read the feature catalogs it validates.
      - run: pnpm --dir tooling/dshx run build
      - run: pnpm run check:cycles
      - run: pnpm run check:native-forks
      - run: pnpm run test:scripts
      - run: pnpm run verify:web-profile-contract
      - run: pnpm run check:repo
      - run: pnpm run check:effect-native
      - run: pnpm run knip
      - run: pnpm run check:screenshots

  boot:
    name: boot (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # A boot check asserts one scratch Host mounts; the journeys that flake under parallel load are the smoke job.
      # Three at a time measured ~2.7x faster on ten cores, so two is conservative on four.
      CHECK_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
          browsers: 'true'
          systemd-scope: 'true'
      # Every bundle's own boot lands in exactly one shard, and the composed web-profile boot in shard 0 only.
      - run: node scripts/ci/plugin-shard.mjs ${{ matrix.shard }} 3 boot

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj: 'true'
          ffmpeg: 'true'
          browsers: 'true'
          systemd-scope: 'true'
      - run: pnpm run check:e2e:smoke

  gate:
    name: gate
    if: always()
    needs: [lint, types, units, dshx, repo, boot, e2e-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # `if: always()` keeps the gate reporting when a dependency fails, and the explicit failure step turns a
      # skipped or cancelled dependency into a red gate: without it a job that never started would leave it green.
      - name: Report every job result
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail when a required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
