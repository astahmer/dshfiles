# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Content search is served by the owned @dshfiles/session-search backend, which
# reconciles its index off the Host event loop; the stock backend reconciles on
# the read path (measured: one search blocked the Host loop for 290 s cold and
# 43.5 s warm). One process may own the `sessionQuery` service, so the stock row
# is disabled and its derived index file is kept on disk untouched for now.
# Re-enable this row only together with removing the owned bundle.
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  disabled: true
  config:
    path: !!js (process.env.DSH_HOME || (process.env.HOME || process.env.USERPROFILE) + '/.dsh') + '/plugins/session-query-sqlite/index.sqlite'
    openAt: first-search
    persistedReadConcurrency: 4
# A prepared cold Session is kept for reuse, and each one holds that Session's whole decoded log: on the live Host
# (2026-11-08) five of them retained 1,376 MB of the heap, sampled at the session-log restore path. One slot keeps
# paging within the Session you are reading fast and drops the rest; a byte-bounded cache belongs to the core engine.
- id: dshfiles-session-search
  config:
    preparedSessionCacheSize: 1
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
# Accounts and model selection are configured explicitly in the writable profile.

# dsh-client-connection's rpc.register() calls owner.webServer.register(route),
# but the row declares only webStartup. Any plugin registering a Host API then
# dies at boot with "cannot get property webServer without inject". Declaring
# the missing edge here is the smallest fix until DSH ships it.
- id: connection
  inject:
    - webStartup
    - webServer

# The account seed is empty. Identities/preferences belong to local AI Accounts
# storage; credentials stay in the provider's local auth store.
- id: ai-accounts
  config:
    edgeWidget: false
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: light
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: {}
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    transcriptView: detailed
- id: dshfiles-jujutsu
  name: '@dshfiles/jujutsu'
  config:
    hideImmutable: false
    fileView: flat
# BEGIN NIX-MANAGED DSH PLUGINS
# A profile seeded before the owned search backend keeps the stock row enabled in
# its own layer above, and only this region is reconciled into an existing
# profile; so the disable is repeated here for those profiles. One process may own
# the `sessionQuery` service: enabled, the stock row registers first, wins it, and
# leaves content search on the read path that froze the Host for 290 s per search.
- id: session-query-sqlite
  disabled: true
- id: our-free-model
  config:
    distribution: managed
# Feedback surfaces and uploads are opt-in; session-log download stays enabled.
- id: command-feedback
  disabled: true
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: ui-settings-session-log
  disabled: true
- id: session-log-download
  disabled: false
# The right-Sidebar Browser tab is off in stock Web profiles. @dshfiles/preview's dev-server Open, preview_reveal and
# chat links opened In-App Sidebar all land in it (the dshx Browser contract @dshfiles/chat provides over it).
- id: ui-sidebar-browser
  disabled: false
# OpenTelemetry GenAI spans for turns, steps, model calls and tools come from @dshfiles/agent-telemetry (row
# dshfiles-agent-telemetry, forked from @loongsuite/dsh-plugin, whose gated `loongsuite-observability` row is gone).
# Its row has no `disabled` gate: spans are no-ops until dshx tracing has a destination, the OTEL_EXPORTER_OTLP_*
# endpoint or the in-process receiver of @dshfiles/traces (row dshfiles-traces), which in its default `plugin` mode
# listens on 127.0.0.1:4318 and takes agent, dshx and usage telemetry from this same Host without any variable. Its
# `mode` setting hands the port to an external viewer (`external`) or forwards to one (`both`). See
# docs/observability.md.
# Brave replaces DeepSeek's server-side search: the same key the Models page manages
# for chat is a chat key, not a search key. Configure a key reference locally in
# dshfiles-web-search-brave settings; fetch stays anonymous HTTP.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: brave
    fetchProvider: http
# Host HMR recomposes a running Host whenever a linked bundle or a patch file changes, and a replacement can drop a
# plugin service another row depends on — 2026-10-19 the live `web` profile lost `sessionQuery` on two bundle
# rebuilds, which took `session-controller` and the whole Session surface with it, and only a restart cleared it.
# Off by default until a replacement is proven safe; client HMR is a separate bundle and stays on, but enabling or
# disabling a plugin in Settings now needs a restart. See docs/recovery.md.
- id: hmr
  disabled: true
# Each compaction checkpoint keeps the names of the skills its span loaded, so a long thread does not reload them after
# every compaction. Replayed on five recorded threads it kept 37–100 % of loaded skills visible after a checkpoint
# (11–34 % without it) for under 0.5 % more request tokens (plugins/@dshfiles/context-compaction/README.md, engine setup
# comparison). A patch replaces the bundle row's whole config, so maxTokens is restated.
- id: dshfiles-context-compaction
  config:
    maxTokens: 8192
    loadedSkills: names
# BEGIN DERIVED preset-standard (node scripts/dsh-compat/standard-preset.mjs --write)
# Generated from @deepseek-ai/dsh-web-app 0.2.2-rc.2 presets/standard.patch.yml; do not edit by hand. A patch
# replaces a row's whole config, so this restates the shipped preset with these changes:
#   tool-subagent: owned fork: child model routes follow the Subagents setting in running threads (b:rmkm)
#   tool-subagent-fork: the same owned fork for subagent_fork
#   tool-ask-user: owned fork that tells the model the form renders markdown and html previews (b:6); timed mode lets a question stay answerable while the agent works (timeout -1 blocks)
#   skill-filesystem: stock points customSkillDirs at @deepseek-ai/dsh-agent-preset resolved from the patch file; from a profile patch that package does not resolve and the expression would break the whole preset, so this row keeps the default skill directories
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          # Set false to drop the apply_patch tool beside edit.
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: tool-subagent
            name: '@dshfiles/tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@dshfiles/tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@dshfiles/tool-ask-user'
        config:
          mode: timed
          timeout: 300
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true
# END DERIVED preset-standard
# END NIX-MANAGED DSH PLUGINS
