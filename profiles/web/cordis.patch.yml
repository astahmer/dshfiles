# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-commandcode
  name: "@mars-sea/dsh-commandcode-provider"
  config:
    apiKeyEnv: COMMANDCODE_API_KEY
    visibleModels:
      - stealth/space-bunny-alpha
      - gpt-6-luna
    modelVisibility: {}
    showSidebarQuota: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codex-alex2
    model: gpt-6-luna
    reasoningEffort: max

# dsh-client-connection's rpc.register() calls owner.webServer.register(route),
# but the row declares only webRuntime. Any plugin registering a Host API then
# dies at boot with "cannot get property webServer without inject". Declaring
# the missing edge here is the smallest fix until DSH ships it.
- id: connection
  inject:
    - webRuntime
    - webServer

# Async questions: the shipped `tool-ask-user` row declares no config, so it
# defaults to the blocking legacy schema. Selecting timed mode lets a model call
# ask_user_question with `timeout: -1` to block until answered, or any positive
# seconds to keep working while the question stays answerable; a later answer is
# steered in as a user-question-reply message. Preset plugins are config data,
# so patch their id inside the preset's `config.plugins` list.
- id: preset-standard
  config:
    plugins:
      - id: tool-ask-user
        config:
          mode: timed
          timeout: 300

# Account identities and model preferences are in ai-accounts.json; credentials
# stay in the provider's local auth store.
- id: ai-accounts
  config:
    edgeWidget: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
- id: dshfiles-jujutsu
  name: "@dshfiles/jujutsu"
  config:
    hideImmutable: false
    fileView: flat
# BEGIN NIX-MANAGED DSH PLUGINS
- id: our-free-model
  config:
    distribution: managed
# END NIX-MANAGED DSH PLUGINS
